// Icon resolution with caching
function iconFor(link) {
  const cacheKey = `${link.id || ''}:${link.icon_source || ''}:${link.icon || ''}:${link.type || ''}:${link.url || ''}`;
  
  let icon;
  if (link.icon_source === 'upload' && link.icon) {
    icon = `assets/img/icons/${link.icon}`;
  } else if (link.icon_source === 'type' && TYPE_ICONS[link.type]) {
    icon = TYPE_ICONS[link.type];
  } else if (link.icon_source === 'auto' || !link.icon_source || link.icon_source === '') {
    if (TYPE_ICONS[link.type]) {
      icon = TYPE_ICONS[link.type];
    } else {
      try {
        const domain = new URL(link.url).hostname;
        icon = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
      } catch {
        icon = TYPE_ICONS.custom;
      }
    }
  } else {
    icon = TYPE_ICONS.custom;
  }
  
  return icon;
}

// Link Card Component
function LinkCard({ link }) {
  const [copied, setCopied] = useState(false);

  const handleCopy = async (e) => {
    e.preventDefault();
    e.stopPropagation();
    try {
      await navigator.clipboard.writeText(link.url);
      setCopied(true);
      setTimeout(() => setCopied(false), 1200);
    } catch (err) {
      console.error('فشل نسخ الرابط:', err);
    }
  };

  return (
    <a className="link-card" href={link.url} target="_blank" rel="noopener noreferrer">
      <img className="link-card__icon" src={iconFor(link)} alt="" loading="eager" />
      <span className="link-card__title">{link.title}</span>
      {(link.show_copy === true || link.show_copy === 'true' || link.show_copy === '1') && (
        <button 
          className="link-card__copy-btn" 
          type="button" 
          aria-label="نسخ الرابط"
          onClick={handleCopy}
          style={{ background: copied ? 'rgba(37,211,102,0.3)' : '', borderColor: copied ? 'rgba(37,211,102,0.5)' : '' }}
        >
          <span dangerouslySetInnerHTML={{ __html: SVG.copy }} />
        </button>
      )}
    </a>
  );
}

// Tab Switcher Component
function TabSwitcher({ activeTab, onTabChange }) {

// Main App Component
function App() {
  const [loading, setLoading] = useState(true);
  const [links, setLinks] = useState([]);
  const [settings, setSettings] = useState({});
  const [activeTab, setActiveTab] = useState('links');
  const [copiedLink, setCopiedLink] = useState(null);

  // Apply appearance settings
  useEffect(() => {
    if (!settings.appearance) return;
    
    const root = document.documentElement;
    const a = settings.appearance;
    
    if (a.background_color) root.style.setProperty('--color-bg', a.background_color);
    if (a.primary_color) root.style.setProperty('--color-primary', a.primary_color);
    if (a.secondary_color) root.style.setProperty('--color-secondary', a.secondary_color);
    if (a.header_bg) root.style.setProperty('--header-bg', a.header_bg);
    if (a.header_text) root.style.setProperty('--header-text', a.header_text);
    if (a.header_tagline) root.style.setProperty('--header-tagline', a.header_tagline);
    if (a.footer_bg) root.style.setProperty('--footer-bg', a.footer_bg);
    if (a.footer_text) root.style.setProperty('--footer-text', a.footer_text);
    if (a.footer_border) root.style.setProperty('--footer-border', a.footer_border);
    if (a.card_bg) root.style.setProperty('--card-bg', a.card_bg);
    if (a.card_border) root.style.setProperty('--card-border', a.card_border);
    if (a.card_text) root.style.setProperty('--card-text', a.card_text);
    if (a.branch_bg) root.style.setProperty('--branch-bg', a.branch_bg);
    if (a.branch_border) root.style.setProperty('--branch-border', a.branch_border);
    if (a.branch_name) root.style.setProperty('--branch-name', a.branch_name);
    if (a.branch_text) root.style.setProperty('--branch-text', a.branch_text);
    if (a.branch_details_bg) root.style.setProperty('--branch-details-bg', a.branch_details_bg);
    
    document.body.classList.remove('layout-list', 'layout-grid');
    document.body.classList.add(a.layout_style === 'grid' ? 'layout-grid' : 'layout-list');
    
    document.body.classList.remove('card-style-glass', 'card-style-elevated', 'card-style-outline', 'card-style-flat', 'card-style-spatial', 'spatial-glass');
    const cardStyle = a.card_style || 'glass';
    if (cardStyle === 'spatial-glass') {
      document.body.classList.add('spatial-glass');
      document.body.classList.add('card-style-spatial');
    } else {
      document.body.classList.add(`card-style-${cardStyle}`);
    }
    
    if (a.card_shape) {
      document.body.setAttribute('data-card-shape', a.card_shape);
    }
  }, [settings.appearance]);

  // Apply logo style
  useEffect(() => {
    const shape = settings.logo_shape || 'circle';
    const glow = settings.logo_glow !== false;
    
    document.body.classList.remove('logo-circle', 'logo-rounded', 'logo-original');
    document.body.classList.add(`logo-${shape}`);
    document.body.classList.toggle('logo-glow', glow);
    
    const wrap = document.getElementById('logoWrap');
    if (wrap) {
      wrap.style.borderRadius = shape === 'circle' ? '50%' : shape === 'rounded' ? '22px' : '0';
    }
  }, [settings.logo_shape, settings.logo_glow]);

  // Handle URL query params for tab navigation
  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const view = params.get('view');
    if (view === 'branches') {
      setActiveTab('branches');
    } else if (view === 'links') {
      setActiveTab('links');
    }
  }, []);

  // Fetch data from API
  useEffect(() => {
    const fetchData = async () => {
      try {
        const [linksRes, settingsRes] = await Promise.all([
          fetch('api/links.php', { cache: 'no-cache' }),
          fetch('api/settings.php', { cache: 'no-cache' }),
        ]);
        
        const linksData = await linksRes.json();
        const settingsData = await settingsRes.json();
        
        setLinks(linksData.links || []);
        setSettings(settingsData);
        
        // Inject tracking scripts
        injectTrackingScripts(settingsData.tracking_scripts_head || '', 'head');
        injectTrackingScripts(settingsData.tracking_scripts_body || '', 'body');
        
      } catch (err) {
        console.error('[AtoZ] Failed to load page data:', err);
      } finally {
        setLoading(false);
      }
    };
    
    fetchData();
  }, []);

  // Handle tab change
  const handleTabChange = useCallback((panelName) => {
    setActiveTab(panelName);
    const url = new URL(window.location);
    url.searchParams.set('view', panelName);
    window.history.pushState({}, '', url);
  }, []);

  // Inject tracking scripts
  const injectTrackingScripts = (scriptContent, position) => {
    if (!scriptContent || scriptContent.trim() === '') return;
    
    const temp = document.createElement('div');
    temp.innerHTML = scriptContent.trim();
    
    const targetContainer = position === 'head' 
      ? document.getElementById('tracking-head-container')
      : document.getElementById('tracking-body-container');
    
    if (!targetContainer) return;
    
    Array.from(temp.childNodes).forEach((node) => {
      if (node.nodeName === 'SCRIPT') {
        const scriptEl = document.createElement('script');
        Array.from(node.attributes).forEach(attr => {
          scriptEl.setAttribute(attr.name, attr.value);
        });
        
        const scriptText = node.textContent;
        if (scriptText && scriptText.trim()) {
          try {
            (0, eval)(scriptText.trim());
            scriptEl.textContent = scriptText.trim();
          } catch (e) {
            console.error('[AtoZ] Error executing script:', e);
            scriptEl.textContent = scriptText.trim();
          }
        }
        targetContainer.appendChild(scriptEl);
      }
    });
  };

  // Sort branches by order
  const sortedBranches = useMemo(() => {
    if (!settings.branches) return [];
    return [...settings.branches].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  }, [settings.branches]);

  if (loading) {
    return (
      <div className="page" id="page">
        <div className="bg-orb bg-orb--1" aria-hidden="true"></div>
        <div className="bg-orb bg-orb--2" aria-hidden="true"></div>
        <div className="bg-orb bg-orb--3" aria-hidden="true"></div>
        <div style={{ textAlign: 'center', padding: '40px', color: 'var(--color-text-muted)' }}>
          جاري التحميل...
        </div>
      </div>
    );
  }

  return (
    <div className="page" id="page">
      {/* Ambient background orbs */}
      <div className="bg-orb bg-orb--1" aria-hidden="true"></div>
      <div className="bg-orb bg-orb--2" aria-hidden="true"></div>
      <div className="bg-orb bg-orb--3" aria-hidden="true"></div>
      
      <Header settings={settings} />
      
      <TabSwitcher activeTab={activeTab} onTabChange={handleTabChange} />
      
      {/* Links Panel */}
      {activeTab === 'links' && (
        <section id="panel-links" role="tabpanel" aria-labelledby="tab-links" className="panel">
          {settings.app_links && settings.app_links.app_block_position === 'top' && (
            <AppBlock appLinks={settings.app_links} />
          )}
          
          <nav className="links" id="linksList" aria-label="روابط التواصل">
            {links.length === 0 ? (
              <p style={{ textAlign: 'center', color: 'var(--color-text-muted)', padding: '20px 0' }}>
                لا توجد روابط متاحة حالياً
              </p>
            ) : (
              links.map((link) => (
                <LinkCard key={link.id} link={link} />
              ))
            )}
          </nav>
          
          {(!settings.app_links || settings.app_links.app_block_position !== 'top') && (
            <AppBlock appLinks={settings.app_links} />
          )}
        </section>
      )}
      
      {/* Branches Panel */}
      {activeTab === 'branches' && (
        <section id="panel-branches" role="tabpanel" aria-labelledby="tab-branches" className="panel">
          <div id="branchesList" className="branches-list">
            {sortedBranches.length === 0 ? (
              <p style={{ textAlign: 'center', color: 'var(--color-text-muted)', padding: '20px 0' }}>
                لا توجد فروع مضافة
              </p>
            ) : (
              sortedBranches.map((branch) => (
                <BranchCard key={branch.id} branch={branch} settings={settings} />
              ))
            )}
          </div>
        </section>
      )}
      
      {/* Footer */}
      <footer className="page__footer">
        <span>
          {settings.footer_text 
            ? settings.footer_text.replace('{year}', new Date().getFullYear())
            : `AtoZ Store © ${new Date().getFullYear()}`
          }
        </span>
      </footer>
    </div>
  );
}

// Render the app
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
